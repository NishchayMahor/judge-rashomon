[project]
name = "judge-rashomon"
version = "0.1.0"
description = "Do LLM judges that agree with humans equally well agree on which system is better?"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
judge-rashomon = "judge_rashomon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judge_rashomon"]
